# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,2
monitor=,preferred,auto,auto

# Left Monitor
monitorv2 {
  output = DP-1
  mode = 5120x2880@60
  position = 0x0
  scale = 2
  transform = 0
}

# Right Monitor, portrait mode
monitorv2 {
  output = DP-4
  mode = 5120x2880@60
  position = 2560x-810
  scale = 2
  transform = 1
}


workspace=name:1, monitor:DP-1, default:true, persistent:true
workspace=name:2, monitor:DP-1, default:true, persistent:true
workspace=name:3, monitor:DP-1, default:true, persistent:true

workspace=name:4, monitor:DP-4, default:true, persistent:true
workspace=name:5, monitor:DP-4, default:true, persistent:true

